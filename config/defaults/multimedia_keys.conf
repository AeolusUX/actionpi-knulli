KEY_VOLUMEUP 1               /usr/bin/volume-button volup
KEY_VOLUMEDOWN 1             /usr/bin/volume-button voldown
KEY_VOLUMEUP 0               /usr/bin/volume-button-release
KEY_VOLUMEDOWN 0             /usr/bin/volume-button-release
KEY_VOLUMEUP+BTN_SELECT 1      /userdata/system/brightness-osd/brightness-button briup
KEY_VOLUMEDOWN+BTN_SELECT 1    /userdata/system/brightness-osd/brightness-button bridown
KEY_VOLUMEUP+BTN_SELECT 0      /usr/bin/volume-button-release
KEY_VOLUMEDOWN+BTN_SELECT 0    /usr/bin/volume-button-release
KEY_POWER 1                  /usr/bin/power-button
KEY_POWER 0                  /usr/bin/power-button-release
BTN_START+BTN_SELECT 1       knulli-screenshot
BTN_SELECT+BTN_MODE 1        /usr/bin/dpad-toggle
SW_TABLET_MODE 1             /usr/bin/toggle-switch enable
SW_TABLET_MODE 0             /usr/bin/toggle-switch disable
SW_HEADPHONE_INSERT 1        /usr/bin/trimui-dac-swap headphone
SW_HEADPHONE_INSERT 0        /usr/bin/trimui-dac-swap speaker
BTN_START+BTN_MODE+ 1        /usr/bin/knulli-softreset
KEY_HOME 1 /usr/bin/python3 /boot/ACTIONPI_FIXES/home_exit.py
